name: Windows app

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: x86_64 zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build zip
        shell: pwsh
        run: powershell -File scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Canon-windows-x86_64
          path: dist/windows/*.zip
          if-no-files-found: error
