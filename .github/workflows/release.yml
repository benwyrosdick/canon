name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/linux-app.yml
  macos:
    uses: ./.github/workflows/macos-app.yml
    secrets: inherit
  windows:
    uses: ./.github/workflows/windows-app.yml
  github-release:
    name: GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          printf 'Attaching:\n'
          printf '  %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${files[@]}"
